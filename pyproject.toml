[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundlink"
version = "0.1.0"
description = "Ground-station contact planning and optimal downlink scheduling for satellite constellations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ground station", "satellite", "contact planning", "downlink scheduling", "link budget", "DVB-S2", "space operations", "MILP"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
groundlink = "groundlink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
